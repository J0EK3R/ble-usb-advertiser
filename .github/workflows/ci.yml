# CI for the BC2 USB BLE advertiser firmware: host unit tests and a firmware build.
name: CI

on:
  push:
  pull_request:

env:
  # Pinned ESP-IDF release, keep in sync with docs/development.md.
  IDF_VERSION: v5.5.6

jobs:
  host-tests:
    name: Host unit tests (C and Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C tests
        run: |
          cmake -S test/host -B build-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
      - name: Run Python tests
        run: python3 -m unittest discover -s tools/tests -v

  firmware:
    name: Firmware build (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          command: idf.py build
      - name: Create merged flash image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          command: bash -c "cd build && esptool.py --chip esp32s3 merge_bin -o bc2-usb-advertiser-merged.bin @flash_args"
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bc2-usb-advertiser-firmware
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
